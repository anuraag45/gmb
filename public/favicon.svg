<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Outer Shield / Circle with Navy & Gold Border -->
  <defs>
    <linearGradient id="gmbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="gmbNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3864" />
      <stop offset="100%" stop-color="#071E36" />
    </linearGradient>
    <linearGradient id="gmbWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="120" cy="120" r="114" fill="url(#gmbNavy)" stroke="url(#gmbGold)" stroke-width="5" />
  <circle cx="120" cy="120" r="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="4 3" stroke-width="1.5" />

  <!-- Sun rays / Lighthouse Glow at Top -->
  <path d="M120 32 L120 44 M96 38 L102 48 M144 38 L138 48 M78 52 L87 59 M162 52 L153 59" stroke="url(#gmbGold)" stroke-width="3" stroke-linecap="round" />

  <!-- Ship Helm / Steering Wheel Base -->
  <circle cx="120" cy="122" r="46" fill="none" stroke="url(#gmbGold)" stroke-width="4.5" />
  <!-- Wheel Handles / Spokes -->
  <path d="M120 70 L120 174 M70 122 L170 122 M84 86 L156 158 M156 86 L84 158" stroke="url(#gmbGold)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="120" cy="122" r="32" fill="#0B2F52" stroke="#FFFFFF" stroke-width="2" />

  <!-- Stylized Maritime Anchor -->
  <!-- Anchor Stock & Ring -->
  <circle cx="120" cy="74" r="8" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
  <rect x="100" y="88" width="40" height="6" rx="3" fill="#FFFFFF" />
  <!-- Anchor Shank -->
  <rect x="116" y="80" width="8" height="68" rx="2" fill="#FFFFFF" />
  <!-- Anchor Flukes & Crown -->
  <path d="M82 134 C82 168 158 168 158 134" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- Anchor Arrow Tips -->
  <path d="M74 136 L84 122 L94 136 Z" fill="#FFFFFF" />
  <path d="M146 136 L156 122 L166 136 Z" fill="#FFFFFF" />
  <!-- Center Anchor Joint Dot -->
  <circle cx="120" cy="122" r="6" fill="url(#gmbGold)" />

  <!-- Water Waves at Base of Shield -->
  <path d="M48 168 C62 160 76 174 90 168 C104 162 118 174 132 168 C146 162 160 174 174 168 C184 164 192 166 196 169" fill="none" stroke="url(#gmbWater)" stroke-width="4" stroke-linecap="round" />
  <path d="M54 182 C68 175 80 187 94 182 C108 177 120 187 134 182 C148 177 160 187 174 182 C182 179 188 181 192 183" fill="none" stroke="url(#gmbWater)" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Text: GMB at Center-Top -->
  <text x="120" y="60" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="3">GMB</text>
  
  <!-- Text: POLYTECHNIC RAJULA at Bottom Arc Banner -->
  <text x="120" y="210" text-anchor="middle" fill="url(#gmbGold)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.5">POLYTECHNIC · RAJULA</text>
</svg>